name: Build iOS Tweak Dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make perl xz-utils build-essential libtinfo5 zstd curl wget

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup Compatible iOS 14.4 SDK
        run: |
          rm -rf $HOME/theos/sdks
          mkdir -p $HOME/theos/sdks
          curl -L https://github.com/theos/sdks/releases/download/v1.0/iPhoneOS14.4.sdk.tar.xz -o $HOME/theos/sdks/iPhoneOS14.4.sdk.tar.xz
          tar -xf $HOME/theos/sdks/iPhoneOS14.4.sdk.tar.xz -C $HOME/theos/sdks/
          rm -f $HOME/theos/sdks/iPhoneOS14.4.sdk.tar.xz

      - name: Install Linux iOS Toolchain (Clang)
        run: |
          mkdir -p $HOME/theos/toolchain/linux/iphone
          cd $HOME/theos
          curl -L https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma -o toolchain.tar.lzma
          TMP=$(mktemp -d)
          tar --lzma -xf toolchain.tar.lzma -C $TMP
          mv $TMP/ios-arm64e-clang-toolchain/* $HOME/theos/toolchain/linux/iphone/
          rm -rf $TMP toolchain.tar.lzma

      - name: Compile Tweak
        run: |
          export THEOS=$HOME/theos
          make clean
          make FINALPACKAGE=1

      - name: Locate Built Files
        run: |
          mkdir -p output
          find .theos/ -name "*.dylib" -exec cp {} output/ \;
          ls -la output/

      - name: Upload Ready Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LocationHook-Build
          path: output/*
