name: Build iOS Tweak Dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make perl xz-utils build-essential libtinfo5 zstd curl wget

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup iOS SDKs
        run: |
          rm -rf $HOME/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git $HOME/theos/sdks

      - name: Install Linux iOS Toolchain (Clang)
        run: |
          mkdir -p $HOME/theos/toolchain/linux/iphone
          cd $HOME/theos
          curl -L https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma -o toolchain.tar.lzma
          TMP=$(mktemp -d)
          tar --lzma -xf toolchain.tar.lzma -C $TMP
          mv $TMP/ios-arm64e-clang-toolchain/* $HOME/theos/toolchain/linux/iphone/
          rm -rf $TMP toolchain.tar.lzma

      - name: Compile Tweak
        run: |
          export THEOS=$HOME/theos
          make clean
          make FINALPACKAGE=1

      - name: Upload Ready Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocationHook-Dylib
          path: |
            .theos/obj/*.dylib
            .theos/obj/debug/*.dylib
