name: Build iOS Tweak Dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make perl xz-utils build-essential libtinfo5 zstd curl wget dpkg

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup Official iOS SDKs
        run: |
          rm -rf $HOME/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git $HOME/theos/sdks

      - name: Install Linux iOS Toolchain (Clang)
        run: |
          mkdir -p $HOME/theos/toolchain/linux/iphone
          cd $HOME/theos
          curl -L https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma -o toolchain.tar.lzma
          tar --lzma -xf toolchain.tar.lzma -C toolchain/linux/iphone
          rm toolchain.tar.lzma

      - name: Install CydiaSubstrate Library
        run: |
          cd /tmp
          wget http://apt.saurik.com/debs/mobilesubstrate_0.9.6011_iphoneos-arm.deb
          dpkg-deb -x mobilesubstrate_0.9.6011_iphoneos-arm.deb substrate
          cp substrate/Library/Frameworks/CydiaSubstrate.framework/CydiaSubstrate $HOME/theos/lib/libsubstrate.dylib
          cp substrate/Library/Frameworks/CydiaSubstrate.framework/Headers/CydiaSubstrate.h $HOME/theos/include/substrate.h
          rm -rf substrate mobilesubstrate_0.9.6011_iphoneos-arm.deb

      - name: Compile Tweak
        run: |
          export THEOS=$HOME/theos
          make clean
          make

      - name: Upload Ready Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocationHook-Dylib
          path: .theos/obj/debug/*.dylib
