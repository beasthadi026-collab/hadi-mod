name: Build iOS Tweak Dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make perl xz-utils build-essential libtinfo5 zstd curl

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Download iOS SDK
        run: |
          mkdir -p $HOME/theos/sdks
          cd $HOME/theos/sdks
          curl -LO https://github.com/theos/sdks/raw/master/iPhoneOS14.4.sdk.tar.xz
          tar -xf iPhoneOS14.4.sdk.tar.xz
          rm iPhoneOS14.4.sdk.tar.xz

      - name: Install Linux iOS Toolchain (Clang)
        run: |
          mkdir -p $HOME/theos/toolchain/linux/iphone
          cd $HOME/theos
          curl -L https://github.com/sbingner/llvm-project/releases/latest/download/linux-ios-arm64e-clang-toolchain.tar.lzma -o toolchain.tar.lzma
          tar --lzma -xf toolchain.tar.lzma -C toolchain/linux/iphone
          rm toolchain.tar.lzma

      - name: Compile Tweak
        run: |
          export THEOS=$HOME/theos
          make clean
          make

      - name: Upload Ready Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocationHook-Dylib
          path: .theos/obj/debug/*.dylib
